name: CI

on:
  pull_request:
  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pull contents from CRA-HUB
        run: npm run update-cache

      # Restore (but never save) the snapshots of the official FAQ pages kept
      # by the deploy workflow, so that an outage of the Commission's or ENISA's
      # FAQ pages doesn't fail PR builds
      # (see src/_data/utils/fetch-with-fallback.js)
      - name: Restore snapshots of the official FAQ pages
        uses: actions/cache/restore@v4
        with:
          path: _snapshots
          key: official-faq-snapshots-${{ github.run_id }}
          restore-keys: official-faq-snapshots-

      - name: Build site
        run: npm run build
        env:
          BUILD_ENV: production
